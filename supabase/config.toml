
# Stripe calls this with its own signature (no Supabase JWT) — auth is the
# signature check inside the function, so JWT verification must be off.
[functions.stripe-webhook]
enabled = true
verify_jwt = false

# Public return page shown in the mobile in-app browser after Checkout — it's a
# top-level browser navigation from Stripe, so no JWT.
[functions.checkout-return]
enabled = true
verify_jwt = false

# Called server-side by the pg_cron dispatch_jobs() via net.http_post, which
# can't present a Supabase JWT (app.service_role_key isn't set), so JWT verify
# must be OFF or the offer / auto-accept push is rejected at the gateway.
# TODO(security lockdown): store the service key in Vault, re-secure these, and
# have dispatch_jobs() send a real bearer.
[functions.notify-dispatch]
enabled = true
verify_jwt = false

[functions.notify-provider]
enabled = true
verify_jwt = false

[functions.notify-providers]
enabled = true
verify_jwt = false
import_map = "./functions/notify-providers/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/notify-providers/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/notify-providers/*.html" ]

[functions.auth-confirmed]
verify_jwt = false

# Stripe sends the provider's browser here after Express payout onboarding — a
# top-level navigation with no Supabase JWT, so verification must be off.
[functions.connect-return]
enabled = true
verify_jwt = false

# ── PAYOUTS: public at the gateway, but they authorize THEMSELVES ─────────────
# These MOVE MONEY (Stripe transfers to providers). They were deployed with
# verify_jwt=false so the pg_cron payout job (net.http_post) could reach them —
# which, combined with having no internal auth check, left them callable by
# ANYONE on the internet (found + fixed 2026-07-29). They now require the caller
# to be either the service role (the cron) or an is_admin profile, exactly like
# capture-payment / refund-job.
# DO NOT remove the in-function admin check on the assumption the gateway is
# guarding these — it is not. Verified: no auth / anon key → 403 "Admin only";
# service role + admin JWT → 200.
[functions.batch-payouts]
enabled = true
verify_jwt = false

[functions.process-payout]
enabled = true
verify_jwt = false
